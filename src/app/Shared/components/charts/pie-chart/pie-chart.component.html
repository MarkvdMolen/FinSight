    <div #chartContainer class="p-4">
        <ngx-charts-pie-chart
            [view]="view"
            [scheme]="colorScheme"
            [results]="chartData"
            [gradient]="gradient"

        </ngx-charts-pie-chart>
    </div>
</section>
