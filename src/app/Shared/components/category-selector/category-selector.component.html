<!-- Button to open Excludes -->
<button 
	type="button"
    (click)="isOpen.set(!isOpen())"
    class="inline-flex items-center gap-2 rounded-2xl border px-3 py-2 shadow-sm"
>
	<span class="font-medium">Excludes</span>
	<span class="text-sm opacity-70">({{ excludes().length }} geselecteerd)</span>
	<!-- Dropdown svg -->
	<svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
		<path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.939l3.71-3.71a.75.75 0 111.06 1.061l-4.24 4.24a.75.75 0 01-1.06 0L5.25 8.29a.75.75 0 01-.02-1.06z" clip-rule="evenodd"></path>
	</svg>
</button>

<!-- Panel -->
<div *ngIf="isOpen()"
     class="absolute z-10 mt-2 w-[28rem] max-w-[90vw] rounded-2xl border bg-white p-3 shadow-lg">

  <!-- Search -->
  <input type="text"
         class="w-full rounded-xl border px-3 py-2 mb-2"
         placeholder="Zoek categorie…"
         [value]="query()"
         (input)="query.set($any($event.target).value)" />



  <!-- Lijst met categorie-keys (checkbox per key) -->
  <div class="max-h-80 overflow-auto pr-1">
    <label *ngFor="let key of filteredGroups()"
           class="flex items-center justify-between gap-3 rounded-xl border px-3 py-2 mb-2">
      <div class="flex items-center gap-2">
        <input type="checkbox"
               [checked]="isGroupSelected(key)"
               (change)="toggleGroup(key)"
               class="accent-black">
        <span class="font-semibold">{{ key }}</span>
      </div>
    </label>
  </div>

  <div class="mt-3 flex justify-end">
    <button class="rounded-xl border px-3 py-2" (click)="isOpen.set(false)">Sluiten</button>
  </div>
</div>
