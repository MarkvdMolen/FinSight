<!-- EXCLUDES MULTISELECT -->
<div class="relative inline-block mb-4">
  <button type="button"
          (click)="isOpen.set(!isOpen())"
          class="inline-flex items-center gap-2 rounded-2xl border px-3 py-2 shadow-sm">
    <span class="font-medium">Excludes</span>
    <span class="text-sm opacity-70">({{ excludes().length }} geselecteerd)</span>
    <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.939l3.71-3.71a.75.75 0 111.06 1.061l-4.24 4.24a.75.75 0 01-1.06 0L5.25 8.29a.75.75 0 01-.02-1.06z" clip-rule="evenodd"></path>
    </svg>
  </button>

  <div *ngIf="isOpen()"
       class="absolute z-10 mt-2 w-[28rem] max-w-[90vw] rounded-2xl border bg-white p-3 shadow-lg">
    <!-- Search -->
    <input type="text"
           class="w-full rounded-xl border px-3 py-2 mb-2"
           placeholder="Zoek categorie of naam…"
           [value]="query()"
           (input)="query.set(($any($event.target)).value)" />

    <!-- Bulk / status -->
    <div class="flex items-center justify-between mb-2">
      <div class="text-sm opacity-70">
        {{ options().length }} items • {{ excludes().length }} geselecteerd
      </div>
      <div class="flex gap-2">
        <button class="text-sm underline" (click)="clearAll()">Alle wissen</button>
      </div>
    </div>

    <!-- Groups -->
    <div class="max-h-80 overflow-auto pr-1">
      <div *ngFor="let group of groups()" class="mb-3">
        <div class="flex items-center justify-between">
          <div class="font-semibold">{{ group[0] }}</div>
          <div class="flex gap-2">
            <button class="text-xs underline" (click)="selectAllInGroup(group[0])">Alles</button>
            <button class="text-xs underline" (click)="clearGroup(group[0])">Leeg</button>
          </div>
        </div>

        <div class="mt-1 flex flex-wrap gap-2">
          <label *ngFor="let opt of group[1]"
                 class="inline-flex items-center gap-2 rounded-xl border px-2 py-1 cursor-pointer select-none">
            <input type="checkbox"
                   [checked]="isSelected(opt.value)"
                   (change)="toggle(opt.value)"
                   class="accent-black">
            <span class="text-sm">{{ opt.label }}</span>
          </label>
        </div>
      </div>
    </div>

    <div class="mt-3 flex justify-end">
      <button class="rounded-xl border px-3 py-2" (click)="isOpen.set(false)">Sluiten</button>
    </div>
  </div>
</div>
