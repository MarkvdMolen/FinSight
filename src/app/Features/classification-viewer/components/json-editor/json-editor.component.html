<div class="json-editor">
    <ng-container *ngIf="isObject(json)">
      <ul>
        <li *ngFor="let key of keys(json)">
          <div class="json-key">
            <button (click)="toggleCollapse(key)" class="fold-toggle">
              {{ isCollapsed(key) ? '▶' : '▼' }}
            </button>
            <strong>{{ key }}:</strong>
          </div>
  
          <div *ngIf="!isCollapsed(key)">
            <ng-container *ngIf="isObject(json[key])">
              <app-json-editor [json]="json[key]"></app-json-editor>
            </ng-container>
            <ng-container *ngIf="!isObject(json[key])">
              <input [(ngModel)]="json[key]" />
            </ng-container>
          </div>
        </li>
      </ul>
    </ng-container>
  
    <ng-container *ngIf="!isObject(json)">
      <input [(ngModel)]="json" />
    </ng-container>
  </div>
