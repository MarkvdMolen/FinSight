<div class="flex justify-between items-center mb-4 bg-[#019b988a] rounded-xl p-2">
    <div class="flex gap-2">
      <div class="relative">
        <input 
          type="text" 
          [(ngModel)]="category"
          placeholder="New category name" 
          class="px-3 py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#019b98] text-sm"
        />
        <button (click)="addCategory()"class="px-2 py-1 bg-[#019b98] text-white rounded-md hover:bg-[#017f7d] transition-colors text-sm ml-2">
          Add Category
        </button>
      </div>
  
      <button (click)="addProperty()" class="px-2 py-1 bg-[#019b98] text-white rounded-md hover:bg-[#017f7d] transition-colors text-sm">
        Add Property
      </button>
    </div>
</div>
