<!-- Loading state -->
<div *ngIf="isLoading" class="flex flex-col gap-4 p-4 flex-wrap items-center text-center">
    <img class="w-20 h-20 animate-spin" src="https://www.svgrepo.com/show/70469/loading.svg" alt="Loading icon">
    <p>Loading...</p>
</div>
<!-- Table -->
<table *ngIf="!isLoading" class="table-container">
    <thead>
        <app-table-header
            [headers]="headers"
            [sortedBy]="sortedBy"
            [sortDirection]="sortDirection"
            (sort)="sortData($event)">
        </app-table-header>   
    </thead> 
    <tbody>
        <app-table-row
            *ngFor="let transaction of transactions; trackBy: trackById"
            [transaction]="transaction"
            [editingTransaction]="editingTransaction"
            [classificationLabels]="classificationLabels"
            [ruleBasedColoring]="ruleBasedColoring"
            [categoryControl]="categoryControl"
            (edit)="editTransaction(transaction)"
            (save)="saveTransaction()"
            (cancel)="cancelEdit()">
        </app-table-row>
    </tbody>
</table>
<!-- Paginator -->
<mat-paginator
    [length]="totalItems"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="onPageChange($event)">
</mat-paginator>
<!-- Action Buttons -->
<app-tx-actions
    (classify)="classifyAllTransactions()" 
    (save)="pushAllTransactions()">
</app-tx-actions>
