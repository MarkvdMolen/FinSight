<div class="main-content flex flex-col">
	<header>
		<app-greetings></app-greetings>
	</header>

	<div class="flex flex-wrap flex-row justify-end gap-4 mb-4"></div>

	<app-tablist [tabs]="tabs" [(selectedIndex)]="selectedIndex" class="mb-4"></app-tablist>

	<ng-container *ngIf="tabs[selectedIndex] as tab">
		<ng-container 
			*ngComponentOutlet="tab.component; 
			inputs: { avg$, monthlySummary$, expCat$ }"
		>
		</ng-container>
	</ng-container>

	<div *ngIf="expCat$ | async as yearlyData; ">
		{{ yearlyData | json }}
	</div>

</div>
