<div class="graph">
    <ngx-charts-line-chart
        [view]="view"
        [scheme]="colorScheme"
        [results]="data"
        [xAxis]="true"
        [yAxis]="true"
        [legend]="legend"
        [xAxisLabel]="'Month'"
        [yAxisLabel]="'Amount (€)'"
        [showXAxisLabel]="true"
        [showYAxisLabel]="true"
        [autoScale]="true"
        [animations]="true"
        [roundDomains]="true"
        [curve]="curve">
    </ngx-charts-line-chart>
</div>
