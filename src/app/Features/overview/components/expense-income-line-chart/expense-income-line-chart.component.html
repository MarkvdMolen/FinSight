<section class="financial-overview max-w-3xl">
    <div class="bg-white rounded-lg shadow-lg p-4">
        <ngx-charts-line-chart
            [view]="view"
            [scheme]="colorScheme"
            [results]="data"
            [xAxis]="true"
            [yAxis]="true"
            [legend]="legend"
            [xAxisLabel]="'Month'"
            [yAxisLabel]="'Amount (€)'"
            [showXAxisLabel]="true"
            [showYAxisLabel]="true"
            [autoScale]="true"
            [animations]="true"
            [roundDomains]="true"
            [curve]="curve">
        </ngx-charts-line-chart>
    </div>
</section>
