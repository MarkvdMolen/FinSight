<section class="financial-overview max-w-3xl">
      <h2 class="text-2xl font-bold mb-4 text-gray-800 ">Yearly overview</h2>
      <div class="bg-white rounded-lg shadow-lg p-4">
        <ngx-charts-line-chart
            [view]="view"
            [scheme]="colorScheme"
            [results]="monthlySummary$ | async"
            [xAxis]="true"
            [yAxis]="true"
            [legend]="legend"
            [xAxisLabel]="'Month'"
            [yAxisLabel]="'Amount (€)'"
            [showXAxisLabel]="true"
            [showYAxisLabel]="true"
            [autoScale]="true"
            [animations]="true"
            [roundDomains]="true"
            [curve]="curve">
        </ngx-charts-line-chart>
      </div>
</section>
