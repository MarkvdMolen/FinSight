<div class="relative w-full rounded-2xl p-5 shadow-lg text-white ring-1 ring-black/5 hover:shadow-xl transition-shadow duration-200"
  [ngClass]="{
    'bg-primary-200': trend === 'up',
    'bg-accent-100': trend === 'down'
  }"
  role="region"
>
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-white/90 text-sm font-medium select-none">
        {{ title }}
      </div>

      <div class="mt-1 text-3xl font-extrabold tracking-tight">
        {{ formatted }}
      </div>
    </div>

    <div class="mt-1">
      <!-- Trend icon -->
      <span class="inline-flex items-center justify-center rounded-lg bg-white/15 p-2 backdrop-blur-sm">
        <svg *ngIf="trend === 'up'" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" class="h-5 w-5">
          <path d="M4 16l6-6 4 4 6-6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 12V6h-6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg *ngIf="trend === 'down'" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" class="h-5 w-5">
          <path d="M4 8l6 6 4-4 6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 12v6h-6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
  </div>
</div>
